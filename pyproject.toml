[project]
name = "your-spot-backend"
version = "0.1.0"
description = "Backend API for creating personal locations and sharing them with private groups."
authors = [
    {name = "Kate Po",email = "hamster.k.po@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.10.0,<27.0.0)"
]

[tool.black]
line-length = 88
target-version = ["py312"]
